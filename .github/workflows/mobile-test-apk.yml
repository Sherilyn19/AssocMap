name: Build AssocMap Android APK (Railway backend)

on:
  push:
    branches:
      - mobile/railway-production-apk-20261113
    paths:
      - '.github/workflows/mobile-test-apk.yml'
      - 'mobile/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-railway-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    if: github.ref == 'refs/heads/mobile/railway-production-apk-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate Railway production configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('config/railway-production.json').read_text())
          assert c['ASSOCMAP_DATA_MODE'] == 'api'
          assert c['ASSOCMAP_GIS_MODE'] == 'live'
          assert c['ASSOCMAP_SUPABASE_URL'] == 'https://mbpvgmpubsedafexunhs.supabase.co'
          assert c['ASSOCMAP_BACKEND_BASE_URL'] == 'https://portal-assocmap.up.railway.app'
          assert 'vjmamxkjqfhvoaldevki' not in json.dumps(c)
          assert 'staging.assocmap.app' not in json.dumps(c)
          assert c['ASSOCMAP_SUPABASE_PUBLISHABLE_KEY'].startswith('sb_publishable_')
          PY
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Check Flutter analyzer
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Build Android APK (internal installation, debug signed)
        run: flutter build apk --release --no-pub --dart-define-from-file=config/railway-production.json
      - name: Compute APK checksum
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: assocmap-railway-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
